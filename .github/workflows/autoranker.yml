name: Project Dipolog Auto-Ranker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rank-members:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run auto-ranker
        shell: pwsh
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: |
          ./AutoRanker.ps1

      - name: Save member state
        run: |
          git config user.name "Project Dipolog Auto-Ranker"
          git config user.email "actions@github.com"
          git add known-members.json
          git diff --cached --quiet || git commit -m "Update member state"
          git push
