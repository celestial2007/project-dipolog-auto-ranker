name: Project Dipolog Auto-Ranker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  rank-members:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install PowerShell
        uses: Amadevus/pwsh@v2
        with:
          version: "7.4"

      - name: Run auto-ranker
        shell: pwsh
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: |
          ./AutoRanker.ps1
